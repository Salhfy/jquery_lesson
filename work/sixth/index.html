<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../common/css/reset.css">
  <link rel="stylesheet" href="../../common/css/base.css">
  <link rel="stylesheet" href="./css/style.css">
  <title>Document</title>
</head>
<body>
  <div class="wrapper" id="wrapper">
    <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  </div>
  <script src="../../common/js/jquery.js"></script>
  <script>
    function showInitialScreen(){
      const initialHtml = `
        <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
      `;
      $("#wrapper").html(initialHtml);
    }

    function searchPokemon(){
      const randomId = Math.floor(Math.random() * 1025) + 1;

      $.ajax({
        url: `https://pokeapi.co/api/v2/pokemon/${randomId}`,
        method: 'GET'
      })
      .done(function(pokemonData){
        
        $.ajax({
          url: `https://pokeapi.co/api/v2/pokemon-species/${randomId}`,
          method: 'GET'
        }).done(function(speciesData){
          const jpNameObj = speciesData.names.find(n => n.language.name === "ja");
          const jpName = jpNameObj ? jpNameObj.name : pokemonData.name;

          const encountHtml = `
            <p class="name">${jpName}</p>
            <div>
              <img class="img" src="${pokemonData.sprites.front_default}" alt="${jpName}">
            </div>
            <div>
              <button class="btn" id="catch">捕まえる</button>
              <button class="btn" data-js="reset">逃げる</button>
            </div>
          `;
          $("#wrapper").html(encountHtml);

          $("#catch").on("click", function(){
            const rand = Math.random();
            if(rand < 0.5){
              $.ajax({
                url: 'https://pokeapi.co/api/v2/item/4',
                method: 'GET'
              }).done(function(itemData){
                const jpItemNameObj = itemData.names.find(n => n.language.name === "ja");
                const jpItemName = jpItemNameObj ? jpItemNameObj.name : "アイテム";

                const doneHtml = `
                  <p class="name">ゲットしました</p>
                  <div>
                    <img class="img" src="${itemData.sprites.default}" alt="${jpItemName}">
                  </div>
                  <button class="btn" data-js="reset">戻る</button>
                `;
                $("#wrapper").html(doneHtml);
              }).fail(function(){
                alert("アイテムの取得に失敗しました。");
                showInitialScreen();
              });
            }else{
              const failHtml = `
                <p class="text">逃げられてしまった...</p>
                <button class="btn mt" data-js="reset">戻る</button>
              `;
              $("#wrapper").html(failHtml);
            }
          });
        }).fail(function(){
          alert("ポケモンの名前の取得に失敗しました。");
          showInitialScreen();
        });
      })
      .fail(function(){
        alert("ポケモンの取得に失敗しました。もう一度お試しください。");
        showInitialScreen();
      });
    }

    $(document).on("click", "#pokemon_search", searchPokemon);
    $(document).on("click", "[data-js='reset']", showInitialScreen);
  </script>
</body>
</html>
